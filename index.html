<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tycoon Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: awning stripe + masthead, event ribbon, summary strip.
   Viewers get two tabs: a one-page Dashboard (with a sticky jump bar) and Shops.
   The owner in admin mode gets one tab per section. */
:root{
  --bg:#eef1ec; --surface:#fbfcfa; --surface2:#e5eae3; --ink:#16201b; --muted:#56665c; --line:#d3dbd1; --link:#8da398;
  --accent:#0b7a68; --accent-ink:#ffffff; --coin:#9a5a00;
  --good:#1e8449; --warn:#a05f00; --bad:#b83a2a; --on-bad:#ffffff;
  --c1:#0b7a68; --c2:#d99100; --c3:#2f6fb5; --c4:#c4456a; --c5:#7a55c2; --c6:#6f8a1f;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1411; --surface:#161e19; --surface2:#1f2923; --ink:#e7eee9; --muted:#8fa196; --line:#27332c; --link:#4a5d52;
    --accent:#3fd0b0; --accent-ink:#06231c; --coin:#f2b632;
    --good:#4cc48a; --warn:#f2b632; --bad:#ef7b69; --on-bad:#2b0d08;
    --c1:#3fd0b0; --c2:#f2b632; --c3:#6aa6ec; --c4:#ef7fa0; --c5:#a98af0; --c6:#a6c94a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#161e19; --surface2:#1f2923; --ink:#e7eee9; --muted:#8fa196; --line:#27332c; --link:#4a5d52;
  --accent:#3fd0b0; --accent-ink:#06231c; --coin:#f2b632;
  --good:#4cc48a; --warn:#f2b632; --bad:#ef7b69; --on-bad:#2b0d08;
  --c1:#3fd0b0; --c2:#f2b632; --c3:#6aa6ec; --c4:#ef7fa0; --c5:#a98af0; --c6:#a6c94a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 56px;
}
button,input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:1080px;margin:0 auto}
.awning{height:12px;background:repeating-linear-gradient(90deg,var(--accent) 0 20px,var(--surface2) 20px 40px);border-radius:0 0 10px 10px}
.mast{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;padding:20px 0 16px}
.brand{min-width:0}
h1{font:800 clamp(26px,5vw,38px)/1.05 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.mastright{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{display:inline-flex;gap:7px;align-items:center;font:500 12px var(--f-mono);padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.pill.warn .dot{background:var(--warn)}
.pill.bad .dot{background:var(--bad)}
.pill.hot{border-color:var(--coin);color:var(--coin)}
.pill.ok{border-color:var(--good);color:var(--good)}
.pill.no{border-color:var(--bad);color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);font:600 13px var(--f-body);padding:8px 13px;min-height:36px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.adminbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 14px;margin-bottom:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.adminbar p{margin:0;flex:1 1 260px;color:var(--muted);font-size:13px;min-width:0}
.adminbar p b{color:var(--ink)}
.ribbon{display:grid;gap:8px;margin:0 0 14px}
.rib{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.rib.live{border-color:var(--coin)}
.rib b{font-weight:600;overflow-wrap:anywhere}
.rib .fx{font:600 13px var(--f-mono);color:var(--coin)}
.rib .rt{margin-left:auto;color:var(--muted);font-size:13px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 18px}
.summary>div{background:var(--surface);padding:12px 14px;min-width:0}
.summary dt{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.summary dd{margin:3px 0 0;font:600 20px var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.navwrap{margin-bottom:18px}
.navwrap.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font:600 14px var(--f-body);padding:11px 14px;min-height:44px;white-space:nowrap;cursor:pointer}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.jumpbar{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:thin}
.jchip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 12px var(--f-body);padding:6px 12px;border-radius:99px;min-height:32px;cursor:pointer;white-space:nowrap}
.jchip:hover{color:var(--ink);border-color:var(--muted)}
.panel{min-width:0}
.sec{margin-bottom:36px;scroll-margin-top:120px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.bar h2{font:800 20px var(--f-display);margin:0;letter-spacing:-.01em}
.bar .hint{color:var(--muted);font-size:13px;margin:2px 0 0}
.baract{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:grid;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:12px}
.btn{font:600 13px var(--f-body);padding:8px 13px;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.armed{background:var(--bad);color:var(--on-bad);border-color:var(--bad)}
.btn.ico{padding:6px 10px;min-width:36px}
.btn.sm{padding:5px 10px;min-height:30px;font-size:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.who{display:flex;gap:12px;align-items:center;flex:1 1 200px;min-width:0}
.whotxt{min-width:0}
.whotxt h3{margin:0;font:600 16px var(--f-body);overflow-wrap:anywhere}
.whotxt p{margin:0;color:var(--muted);font-size:12px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 15px var(--f-display);flex:none}
.cell{display:flex;flex-direction:column;gap:3px;min-width:110px}
.cell.grow{flex:2 1 220px;min-width:0}
.lbl{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font:600 16px var(--f-mono);font-variant-numeric:tabular-nums}
.coin{color:var(--coin)}
.faint{color:var(--muted);font-size:13px}
p.faint{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:7px;align-items:baseline;padding:3px 10px;border-radius:99px;background:var(--surface2);font-size:12px}
.chip b{font:600 12px var(--f-mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px;align-content:start;min-width:0}
.card h3{margin:0;font:600 17px var(--f-body);overflow-wrap:anywhere}
.card .meta{margin:2px 0 0;color:var(--muted);font-size:12px}
.card.fin,.card.ended{opacity:.78}
.card-top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.card-acts{display:flex;gap:6px;flex-wrap:wrap}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.metrics .full{grid-column:1/-1}
.inwrap{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden;max-width:100%}
.inwrap .pre{padding:0 0 0 9px;color:var(--coin);font:600 14px var(--f-mono)}
.qin{width:100%;min-width:70px;max-width:130px;border:0;background:none;color:var(--ink);font:600 15px var(--f-mono);padding:7px 9px;min-height:34px}
.qin.small{min-width:56px;max-width:84px;min-height:30px;padding:4px 8px;font-size:14px}
.qin:focus-visible{outline-offset:-2px}
.track{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.track>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.rate{display:flex;align-items:center;gap:10px}
.rate .track{flex:1}
.stackbar{display:flex;height:22px;border-radius:7px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.stackbar>span{display:block;height:100%;min-width:2px}
.stackbar>.free{background:repeating-linear-gradient(135deg,var(--surface2) 0 6px,var(--line) 6px 12px)}
.big{font:800 clamp(34px,8vw,54px)/1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.flowhead{display:flex;flex-wrap:wrap;gap:12px 36px;align-items:flex-end;margin-bottom:14px}
.flowhead .cell{min-width:0}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.crow .nm{display:flex;gap:10px;align-items:center;flex:1 1 180px;min-width:0;font-weight:600;overflow-wrap:anywhere}
.crow .sh{font:500 13px var(--f-mono);color:var(--muted);min-width:48px;text-align:right}
.group{margin:16px 0 8px;font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.shophead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin:22px 0 6px}
.shophead h3{margin:0;font:800 18px var(--f-display);letter-spacing:-.01em}
.shophead p{margin:0;color:var(--muted);font-size:13px}
.item{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;align-content:start;min-width:0}
.item.hidden{opacity:.6;border-style:dashed}
.item h4{margin:0;font:600 15px var(--f-body);overflow-wrap:anywhere}
.line{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.tag.bad{color:var(--bad)}
.tag.warn{color:var(--warn)}
.tag.good{color:var(--good)}
.strike{text-decoration:line-through;color:var(--muted);font:500 13px var(--f-mono)}
.mult{font:600 11px var(--f-mono);padding:1px 6px;border-radius:5px;background:var(--coin);color:var(--bg);vertical-align:middle}
.menu{display:grid;gap:6px}
.catline{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;margin-top:6px}
.catname{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.spchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip.sp{background:var(--coin);color:var(--bg)}
.chip.sp b{color:inherit}
.daytbl{display:grid;gap:6px}
.daytbl .crow .num{min-width:84px;text-align:right}
button[disabled]{opacity:.5;cursor:not-allowed}
.mi{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.mi .mn{flex:1 1 120px;min-width:0;font-weight:600;overflow-wrap:anywhere}
.mi .mn small{display:block;font:500 11px var(--f-body);color:var(--muted)}
.mi .mp{font:600 14px var(--f-mono);color:var(--coin)}
.mi .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.board ol{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.board li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.board .rk{font:600 13px var(--f-mono);color:var(--muted);text-align:right}
.board .nm{font-weight:600;overflow-wrap:anywhere;min-width:0}
.board .vl{font:600 14px var(--f-mono);font-variant-numeric:tabular-nums}
.board .track{grid-column:2/4;height:5px}
.board li:first-child .rk{color:var(--coin)}
.pchip{border:1px solid var(--line);background:var(--bg);color:var(--muted);font:500 12px var(--f-body);padding:5px 11px;border-radius:99px;min-height:30px;cursor:pointer}
.pchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.evrow{display:flex;gap:14px;align-items:center}
.evbadge{font:800 22px var(--f-display);min-width:68px;text-align:center;padding:10px 8px;border-radius:10px;background:var(--surface2);color:var(--coin);flex:none;font-variant-numeric:tabular-nums}
.evbadge.small{font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.tells{margin:0;font-size:12px;color:var(--muted)}
.tells b{color:var(--ink)}
.sl{margin:4px 0 0;padding-left:18px}
.webwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.webwrap svg{display:block;min-width:600px;width:100%;height:auto}
.web-l{stroke:var(--link);stroke-width:1.6}
.web-n{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.web-t{fill:var(--ink);font:500 12px var(--f-body)}
.linkrow{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.linkrow span{min-width:0;overflow-wrap:anywhere}
.linkform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.linkform select{flex:1 1 150px;min-width:0}
select,.fld input,.search input,.itemrow input,.itemrow select{font:500 14px var(--f-body);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:38px;width:100%}
.search{flex:1 1 200px;max-width:300px}
.empty{padding:30px 16px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty.slim{padding:14px 16px;gap:6px}
.empty b{color:var(--ink);font:600 16px var(--f-body)}
.empty p{margin:0;max-width:44ch}
.subtabs{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);max-width:100%}
.subtabs button{border:0;background:none;color:var(--muted);font:600 13px var(--f-body);padding:8px 14px;min-height:36px;cursor:pointer}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.scrim{position:fixed;inset:0;background:rgba(8,14,11,.58);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{width:min(100%,480px);max-height:92%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px}
.sheet h2{margin:0;font:800 20px var(--f-display);overflow-wrap:anywhere}
.sheet p{margin:0}
.fld{display:grid;gap:5px;font:600 12px var(--f-body);color:var(--muted)}
.fld.chk{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:14px}
.fld.chk input{width:18px;height:18px;min-height:0;accent-color:var(--accent)}
.statrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:6px;margin-bottom:6px}
.invrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:6px;margin-bottom:6px;align-items:center}
.invrow input{font:500 14px var(--f-body);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:38px;width:100%}
.statrow input{font:500 14px var(--f-body);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:38px;width:100%}
.itemrow{display:grid;grid-template-columns:68px minmax(0,1fr) auto;gap:6px;margin-bottom:8px}
.itemrow .in{grid-column:1/-1}
.sheet-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.sp{flex:1}
.foot{margin-top:32px;text-align:center;color:var(--muted);font-size:12px}
.foot button{background:none;border:0;color:var(--muted);font:500 12px var(--f-body);text-decoration:underline;cursor:pointer;padding:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font:600 13px var(--f-body);z-index:60;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:var(--on-bad)}
@media (max-width:520px){
  .cell{min-width:90px}
}
@media (prefers-reduced-motion:no-preference){
  .track>i,.stackbar>span{transition:width .35s ease}
}
</style>
</head>
<body>
<div class="app">
  <div class="awning" aria-hidden="true"></div>
  <header class="mast">
    <div class="brand">
      <h1 id="gname">Your game</h1>
      <p class="sub">Live control room</p>
    </div>
    <div id="mastright" class="mastright"></div>
  </header>
  <div id="adminbar" class="adminbar" hidden></div>
  <div id="ribbon" class="ribbon" hidden></div>
  <dl id="summary" class="summary"></dl>
  <div id="navwrap" class="navwrap">
    <nav id="tabs" class="tabs" aria-label="Pages"></nav>
    <nav id="jump" class="jumpbar" aria-label="Jump to a section" hidden></nav>
  </div>
  <main id="panel" class="panel"></main>
  <footer id="foot" class="foot"></footer>
</div>
<div id="modal" class="scrim" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getFirestore, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var num=function(v,d){var n=Number(v);return isFinite(n)&&v!==null&&v!==''&&v!==undefined?n:(d||0);};
var int=function(v){return Math.round(num(v)).toLocaleString();};
var pad=function(n){return String(n).padStart(2,'0');};
var now=function(){return Date.now();};
var today=function(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var uid=function(){return 'm'+Math.random().toString(36).slice(2,9);};
var pick=function(a){return a[Math.floor(Math.random()*a.length)];};

var COLLS=['players','friends','stores','shops','shopdefs','boards','quests','deliveries','events','specials','days','meta'];

/* ---------- time ---------- */
function fmtDur(ms){
  ms=Math.max(0,ms);var s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;
  if(d>0)return d+'d '+h+'h';
  if(h>0)return h+'h '+pad(m)+'m '+pad(x)+'s';
  if(m>0)return m+'m '+pad(x)+'s';
  return x+'s';
}
function fmtWhen(ms){return new Date(ms).toLocaleString([],{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
function toLocalInput(ms){var d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function nextHour(){var d=new Date();d.setMinutes(0,0,0);return d.getTime()+3600000;}
function untilMidnight(){
  var n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1);
  var s=Math.max(0,Math.floor((m-n)/1000));
  return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);
}
function until(ms){return '<span class="num" data-until="'+num(ms)+'">'+fmtDur(num(ms)-now())+'</span>';}

/* ---------- events ---------- */
function evState(e,t){return t<num(e.startsAt)?'upcoming':(t<num(e.endsAt)?'live':'ended');}
function liveEvents(){var t=now();return S.events.filter(function(e){return evState(e,t)==='live';});}
function multiplier(){var m=1;liveEvents().forEach(function(e){if(e.type==='multiplier')m=Math.max(m,num(e.value,1));});return m;}
function discountFor(shopId){var p=0;liveEvents().forEach(function(e){if(e.type==='discount'&&(!e.shopId||e.shopId===shopId))p=Math.max(p,Math.min(100,num(e.value)));});return p;}
function rewardHtml(base){
  var m=multiplier();
  if(m>1)return '<span class="num coin">'+money(Math.round(num(base)*m))+'</span> <span class="mult">×'+esc(m)+'</span>';
  return '<span class="num coin">'+money(base)+'</span>';
}
function evEffect(e){
  if(e.type==='multiplier')return '×'+num(e.value,1)+' coins';
  if(e.type==='discount'){var sd=e.shopId?byId(shopDefs(),e.shopId):null;return num(e.value)+'% off '+(sd?sd.name:'every shop');}
  if(e.type==='rush')return num(e.value)+' delivery orders';
  return '';
}

var FIRST=['Mira','Jonas','Layla','Omar','Sana','Theo','Zara','Ivo','Hana','Felix','Dina','Marcus','Yara','Leo','Nadia','Ben'];
var LAST=['Hale','Okafor','Lindqvist','Park','Rahman','Moreau','Castillo','Novak','Haddad','Kowalski','Brandt','Silva'];
var STREETS=['Maple St','Harbor Rd','Willow Lane','Station Ave','Cedar Court','Market Row','Orchard Way','Bell St'];
var FALLBACK=[{name:'Ramen bowl',price:14},{name:'Iced tea',price:6},{name:'Chocolate cake',price:18},{name:'Club sandwich',price:11},{name:'Fruit salad',price:9},{name:'Cheese pizza',price:16}];
var FAKE_ITEMS=['Quantum waffle','Golden spatula','Item_null','Mystery box (do not open)','Dragon soup','Free money bundle'];
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function corrupt(s){
  var map={a:'@',e:'3',i:'1',o:'0',s:'$',t:'7'},out='',n=0;
  for(var i=0;i<s.length;i++){var ch=s.charAt(i),m=map[ch.toLowerCase()];if(m&&(Math.random()<0.65||(n===0&&i===s.length-1))){out+=m;n++;}else{out+=ch;}}
  if(!n)out=s+'#'+(1000+Math.floor(Math.random()*8999));
  return out;
}
function menuItems(s){
  var m=s.menu||{};
  return Object.keys(m).map(function(k){return Object.assign({id:k},m[k]);}).sort(function(a,b){return (num(a.createdAt)-num(b.createdAt))||String(a.name).localeCompare(String(b.name));});
}
function findMenu(st,name){
  var n=String(name).trim().toLowerCase(),its=menuItems(st);
  for(var i=0;i<its.length;i++){if(String(its[i].name).trim().toLowerCase()===n)return its[i];}
  return null;
}
function menuPool(stores){
  var out=[],seen={};
  (stores||S.stores).forEach(function(s){
    var m=s.menu||{};
    Object.keys(m).forEach(function(k){
      var nm=String(m[k].name||'').trim().toLowerCase();
      if(nm&&num(m[k].price)>0&&!seen[nm]){seen[nm]=1;out.push({name:m[k].name,price:num(m[k].price),itemId:k,storeId:s.id});}
    });
  });
  return out;
}
function genOrder(fake,pool){
  pool=(pool&&pool.length)?pool:FALLBACK.map(function(f){return {name:f.name,price:f.price,itemId:'',storeId:''};});
  var lines=Math.min(pool.length,1+Math.floor(Math.random()*3));
  var picks=shuffle(pool).slice(0,lines);
  var items=picks.map(function(p){return {qty:1+Math.floor(Math.random()*4),name:p.name,itemId:p.itemId||'',storeId:p.storeId||''};});
  var base=0;items.forEach(function(it,i){base+=it.qty*picks[i].price;});
  var reward=Math.max(10,Math.round(base*1.2/5)*5);
  var customer=pick(FIRST)+' '+pick(LAST);
  var address=(1+Math.floor(Math.random()*98))+' '+pick(STREETS);
  var tells=[];
  if(fake){
    var kinds=shuffle(['name','item','reward','address','qty']).slice(0,Math.random()<0.5?2:1);
    kinds.forEach(function(k){
      if(k==='name'){customer=corrupt(customer);tells.push('Garbled customer name');}
      else if(k==='item'){var ix=Math.floor(Math.random()*items.length);items[ix]={qty:items[ix].qty,name:pick(FAKE_ITEMS),itemId:'',storeId:''};tells.push('An item no store sells');}
      else if(k==='reward'){reward=Math.round(reward*(4+Math.random()*3)/10)*10;tells.push('Earning far too high');}
      else if(k==='address'){address=pick(['','NULL','???','undefined']);tells.push('Missing or broken address');}
      else if(k==='qty'){var jx=Math.floor(Math.random()*items.length);items[jx].qty=40+Math.floor(Math.random()*60);tells.push('Absurd quantity');}
    });
  }
  return {customer:customer,address:address,items:items,reward:reward,fake:!!fake,tells:tells};
}
async function createOrder(fake,opts){
  opts=opts||{};
  var o=genOrder(fake,menuPool(opts.pool));
  var id=db.collection('deliveries').doc().id;
  var data={customer:o.customer,address:o.address,items:o.items,reward:o.reward,status:'offered',random:true,createdAt:now()};
  if(opts.rushId){data.rushId=opts.rushId;data.releaseAt=opts.releaseAt;}
  if(o.fake){if(!(await write('deliverysecrets',id,{fake:true,tells:o.tells},{merge:false})))return false;}
  return await write('deliveries',id,data,{merge:false});
}
async function queueRush(evId,count,releaseAt,pool){
  for(var i=0;i<count;i++){
    var fake=Math.random()*100<fakeChance();
    if(!(await createOrder(fake,{rushId:evId,releaseAt:releaseAt,pool:pool})))return false;
  }
  return true;
}
async function removeOrder(id){

async function syncRush(id,ev){
  var t=now(),all=rushOrders(id),i;
  var untouched=all.every(function(d){return dlStatus(d)==='offered'&&!dlReleased(d,t);});
  if(all.length&&!untouched){if(ev.type==='rush')toast('Orders that already dropped stay as they are.');return;}
  for(i=0;i<all.length;i++)await removeOrder(all[i].id);
  if(ev.type!=='rush')return;
  var n=Math.max(1,Math.min(40,Math.round(num(ev.value,8))));
  if(await queueRush(id,n,num(ev.startsAt)))toast(n+' rush orders queued');
}

function listen(coll){
  db.collection(coll).onSnapshot(function(snap){
    var rows=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});});
    if(coll==='meta'){var m={};rows.forEach(function(r){var id=r.id;var rest=Object.assign({},r);delete rest.id;m[id]=rest;});S.meta=m;}
    else{S[coll]=rows;}
    if(!snap.metadata.fromCache)S.loaded[coll]=true;
    S.status='live';
    maybeRoll();maybeMigrate();
    schedule();
  },function(err){S.status='error';S.err=err&&err.code;schedule();});
}
var secretsOn=false;
function listenSecrets(){
  if(secretsOn)return;
  secretsOn=true;
  db.collection('deliverysecrets').onSnapshot(function(snap){
    var m={};snap.docs.forEach(function(d){m[d.id]=d.data();});S.secrets=m;schedule();
  },function(){});
}
var chains=new Map();
function enqueue(key,fn){var prev=chains.get(key)||Promise.resolve();var next=prev.catch(function(){}).then(fn);chains.set(key,next);return next;}
function errMsg(e){
  var c=e&&e.code;
  if(c==='quota_exceeded'||c==='resource-exhausted')return 'Storage is full. Delete something you no longer need.';
  if(c==='invalid_argument'||c==='permission-denied')return 'That change was refused. Sign in with the owner account to edit.';
  return 'Could not save. Check your connection and try again.';
}
function busy(d){S.saving+=d;paintStatus();}
async function write(coll,id,data,opts){
  var merge=!opts||opts.merge!==false;
  busy(1);
  try{
    await enqueue(coll+'/'+id,async function(){
      var ref=db.doc(coll+'/'+id);
      if(merge){try{await ref.update(data);}catch(e){if(e&&(e.code==='invalid_argument'||e.code==='not-found')){await ref.set(data);}else{throw e;}}}
      else{await ref.set(data);}
    });
    busy(-1);return true;
  }catch(e){busy(-1);toast(errMsg(e),'bad');return false;}
}
async function removeDoc(coll,id){
  busy(1);
  try{await enqueue(coll+'/'+id,function(){return db.doc(coll+'/'+id).delete();});busy(-1);return true;}
  catch(e){busy(-1);toast(errMsg(e),'bad');return false;}
}
async function afterDelete(coll,id){
  var i;
  if(coll==='players'){
    var fl=S.friends.filter(function(f){return f.a===id||f.b===id;});
    for(i=0;i<fl.length;i++)await removeDoc('friends',fl[i].id);
    var ql=S.quests.filter(function(q){return (q.doneBy||[]).indexOf(id)>=0;});
    for(i=0;i<ql.length;i++)await write('quests',ql[i].id,{doneBy:ql[i].doneBy.filter(function(x){return x!==id;})});
    var sl=S.stores.filter(function(s){return s.ownerId===id;});
    for(i=0;i<sl.length;i++)await write('stores',sl[i].id,{ownerId:''});
  }
  if(coll==='stores'){
    var c=S.meta.customers;
    if(c&&c.alloc&&c.alloc[id]!==undefined){var a=Object.assign({},c.alloc);delete a[id];await write('meta','customers',{total:num(c.total),alloc:a},{merge:false});}
  }
  if(coll==='shopdefs'){
    var its=S.shops.filter(function(x){return itemShopId(x)===id;});
    for(i=0;i<its.length;i++)await removeDoc('shops',its[i].id);
    var evs=S.events.filter(function(x){return x.shopId===id;});
    for(i=0;i<evs.length;i++)await write('events',evs[i].id,{shopId:''});
  }
  if(coll==='deliveries'){if(S.secrets[id])await removeDoc('deliverysecrets',id);}
  if(coll==='events')await syncRush(id,{type:'deleted'});
}

async function rollQuests(){
  S.rolled=true;
  var old=S.quests.slice(),i;
  for(i=0;i<old.length;i++)await removeDoc('quests',old[i].id);
  var picks=shuffle(POOL).slice(0,4);
  for(i=0;i<picks.length;i++){
    var id=db.collection('quests').doc().id;
    await write('quests',id,{title:picks[i].title,desc:picks[i].desc,target:picks[i].target,reward:picks[i].reward,doneBy:[]},{merge:false});
  }

}
function maybeRoll(){
  if(S.owner&&!S.rolled&&S.loaded.meta&&S.loaded.quests&&(S.meta.day||{}).date!==today()){rollQuests();}
}
async function endDay(){
  var n=dayNo(),c=S.meta.customers||{},specials=c.specials||[],i;
  var bonusByStore={};specials.forEach(function(sp){if(sp.s)bonusByStore[sp.s]=(bonusByStore[sp.s]||0)+num(sp.b);});
  var per={};
  function pp(p){return per[p.id]=per[p.id]||{name:p.name,earned:0,spent:0,served:0,gain:0};}
  var earned=0,spent=0,served=0;
  S.players.forEach(function(p){var r=pp(p);r.earned+=num(p.earnedToday);r.spent+=num(p.spentToday);earned+=num(p.earnedToday);spent+=num(p.spentToday);});
  S.stores.forEach(function(s){
    var gain=Math.max(0,num(s.earnedToday)+(bonusByStore[s.id]||0));
    served+=num(s.served);earned+=gain;
    var o=byId(S.players,s.ownerId);
    if(o){var r=pp(o);r.earned+=gain;r.gain+=gain;r.served+=num(s.served);}
  });
  var day={n:n,date:(S.meta.day||{}).date||today(),endedAt:now(),earned:earned,spent:spent,served:served,customers:num(c.total),specials:specials.length,players:{}};
  Object.keys(per).forEach(function(k){day.players[k]={name:per[k].name,earned:per[k].earned,spent:per[k].spent,served:per[k].served};});
  var id='d'+String(n).padStart(5,'0');
  if(!(await write('days',id,day,{merge:false})))return;
  for(i=0;i<S.players.length;i++){
    var p=S.players[i],r=per[p.id],patch={earnedToday:0,spentToday:0};
    if(r.gain>0)patch.money=num(p.money)+r.gain;
    if(r.served>0){patch.stats={};patch.stats['Customers served']=num((p.stats||{})['Customers served'])+r.served;}
    await write('players',p.id,patch);
  }
  for(i=0;i<S.stores.length;i++)await write('stores',S.stores[i].id,{earnedToday:0,served:0});
  await write('meta','customers',{total:0,alloc:{},confirmed:false,specials:[]},{merge:false});
  await rollQuests();
  await write('meta','day',{date:today(),n:n+1},{merge:false});
  toast('Day '+n+' ended: '+money(earned)+' earned, '+money(spent)+' spent. Day '+(n+1)+' begins.');
}

  }

  }

function webSvg(){
  var P=S.players.slice().sort(function(a,b){return String(a.name).localeCompare(String(b.name));}),n=P.length;
  var cx=360,cy=225,rx=235,ry=150,pos={};
  P.forEach(function(p,i){var t=-Math.PI/2+2*Math.PI*i/n;pos[p.id]={x:cx+rx*Math.cos(t),y:cy+ry*Math.sin(t),c:Math.cos(t),s:Math.sin(t),n:friendCount(p.id)};});
  var lines=S.friends.filter(function(f){return pos[f.a]&&pos[f.b];}).map(function(f){return '<line class="web-l" x1="'+pos[f.a].x.toFixed(1)+'" y1="'+pos[f.a].y.toFixed(1)+'" x2="'+pos[f.b].x.toFixed(1)+'" y2="'+pos[f.b].y.toFixed(1)+'"/>';}).join('');
  var nodes=P.map(function(p){
    var q=pos[p.id],r=8+Math.min(q.n,8),off=r+8;
    var anchor=q.c>0.25?'start':(q.c<-0.25?'end':'middle');
    var lx=q.x+(q.c>0.25?off:(q.c<-0.25?-off:0));
    var ly=Math.abs(q.c)<=0.25?(q.s>0?q.y+r+15:q.y-r-6):q.y+4;
    var nm=String(p.name);if(nm.length>16)nm=nm.slice(0,15)+'…';
    return '<circle class="web-n" cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="'+r+'"/><text class="web-t" x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="'+anchor+'">'+esc(nm)+'</text>';
  }).join('');
  return '<svg viewBox="0 0 720 450" role="img" aria-label="Network of players and their connections">'+lines+nodes+'</svg>';
}

    }).join('')+'</div>';
    if(c.confirmed===false||c.confirmed===undefined)h+='<p class="faint">Confirm the customers above to unlock spawning.</p>';

async function spawnSpecials(){
  var c=S.meta.customers||{};
  if(!c.confirmed){toast('Confirm today\u2019s customers first.','bad');return;}
  if(!S.specials.length){toast('Add a special customer type first.','bad');return;}
  var types=S.specials.filter(function(t){return num(t.chance)>0;});
  var alloc=c.alloc||{},list=[],assigned=0;
  function roll(storeId,count){
    for(var i=0;i<count;i++){
      var r=Math.random()*100,cum=0;
      for(var j=0;j<types.length;j++){cum+=num(types[j].chance);if(r<cum){list.push({t:types[j].id,name:types[j].name,s:storeId,b:num(types[j].bonus)});break;}}
    }
  }
  S.stores.forEach(function(s){var n=Math.max(0,Math.floor(num(alloc[s.id])));assigned+=n;roll(s.id,n);});
  roll('',Math.max(0,Math.floor(num(c.total))-assigned));
  if(await write('meta','customers',{specials:list,spawnedAt:now()}))toast(list.length?list.length+' special '+(list.length===1?'customer':'customers')+' spawned':'No special customers this time');
}

function deliveriesPanel(){

  var waiting=vis.filter(function(d){return dlStatus(d)==='offered';}).sort(function(a,b){return num(a.createdAt)-num(b.createdAt);});

  }

function deliveryCard(d){
  var e=ed(),s=dlStatus(d),fake=showFake(d.id);
  var st=d.storeId?byId(S.stores,d.storeId):null,who=d.acceptedBy?byId(S.players,d.acceptedBy):null;
  var items=(d.items||[]).map(function(it){return '<span class="chip"><b>'+int(it.qty)+'×</b><span>'+esc(it.name)+'</span></span>';}).join('');
  var pill={offered:'<span class="pill hot">Waiting</span>',accepted:'<span class="pill">Accepted</span>',delivered:'<span class="pill ok">Delivered</span>',scam:'<span class="pill no">Fake order</span>',declined:d.verdict==='fake'?'<span class="pill ok">Caught a fake</span>':'<span class="pill">Declined</span>'}[s]||'<span class="pill">'+esc(s)+'</span>';
  var addr=d.address?'<p class="meta">Deliver to <b>'+esc(d.address)+'</b></p>':(d.random?'<p class="meta">No address given</p>':'');
  var whoTxt=who?esc(who.name):'a player',stTxt=st?esc(st.name):'a store';
  var state='';
  if(s==='offered')state='<p class="faint">Waiting for a store to accept or decline.</p>';
  else if(s==='accepted')state='<p class="faint">Accepted by '+whoTxt+(st?' for '+stTxt:'')+'.</p>';
  else if(s==='delivered')state='<p class="faint">Delivered'+(who?' by '+whoTxt:'')+(st?' from '+stTxt:'')+(num(d.paid)>0?' · paid '+money(d.paid):'')+'.</p>';
  else if(s==='scam')state='<p class="faint">It was a fake order. '+(who?whoTxt+' lost '+money(d.penalty)+'.':'Nobody was paid.')+'</p>';
  else if(s==='declined')state='<p class="faint">Declined'+(who||d.declinedBy?'':'')+'. '+(d.verdict==='fake'?'It was a fake order'+(num(d.bonus)>0?', and a '+money(d.bonus)+' bonus was paid for catching it.':'.'):'It was a real order.')+'</p>';
  var tells='';
  if((s==='scam'||(s==='declined'&&d.verdict==='fake'))&&(d.tells||[]).length)tells='<p class="tells"><b>Giveaways:</b> '+esc(d.tells.join(', '))+'.</p>';
  var adminFake=fake&&DL_OPEN[s]?'<div><span class="tag bad">Fake · only you can see this</span>'+(tellsOf(d.id).length?'<p class="tells">'+esc(tellsOf(d.id).join(', '))+'</p>':'')+'</div>':'';
  var earn=s==='delivered'?'<span class="num coin">'+money(d.paid>0?d.paid:d.reward)+'</span>':(s==='scam'||s==='declined'?'<span class="num faint">'+money(d.reward)+'</span>':rewardHtml(d.reward));
  var acts='';
  if(e){
    if(s==='offered')acts='<button class="btn primary" data-act="accept" data-id="'+esc(d.id)+'">Accept</button><button class="btn" data-act="decline" data-id="'+esc(d.id)+'">Decline</button>';
    else if(s==='accepted')acts='<button class="btn primary" data-act="deliver" data-id="'+esc(d.id)+'">Delivered</button>';
    acts='<div class="card-acts">'+acts+'<button class="btn" data-act="edit" data-coll="deliveries" data-id="'+esc(d.id)+'">Edit</button></div>';
  }
  return '<article class="card'+(DL_OPEN[s]?'':' fin')+'"><div class="card-top"><div><h3>'+esc(d.customer)+'</h3>'+addr+'</div>'+pill+'</div>'+
    '<div class="chips">'+(items||'<span class="faint">No items</span>')+'</div>'+
    '<div class="line"><span class="lbl">Earning</span>'+earn+'</div>'+state+tells+adminFake+acts+'</article>';
}

/* leaderboard */
function fieldOptions(source){
  if(source==='stores')return [['earnedToday','Money earned today'],['served','Customers served'],['rating','Rating']];
  var keys={};S.players.forEach(function(p){Object.keys(p.stats||{}).forEach(function(k){keys[k]=1;});});
  return [['money','Money']].concat(Object.keys(keys).sort().map(function(k){return [k,k];}));
}
function fieldLabel(source,field){var o=fieldOptions(source).filter(function(x){return x[0]===field;})[0];return o?o[1]:field;}
function boardRows(b){
  var src=b.source==='stores'?S.stores:S.players;
  var rows=src.map(function(r){
    var v=b.source==='stores'?num(r[b.field]):(b.field==='money'?num(r.money):num((r.stats||{})[b.field]));
    return {name:r.name,v:v};
  });
  rows.sort(function(a,c){return b.dir==='asc'?a.v-c.v:c.v-a.v;});
  return rows.slice(0,10);
}
function fmtField(b,v){
  if((b.source==='players'&&b.field==='money')||(b.source==='stores'&&b.field==='earnedToday'))return money(v);
  if(b.source==='stores'&&b.field==='rating')return num(v).toFixed(1);
  return int(v);
}
function leaderboardPanel(){
  var e=ed();
  var h=head('Leaderboards','Ranked live from player and store numbers',e?addBtn('boards','Add board'):'');
  if(!S.boards.length)return h+empty('No leaderboards yet.',e?'Add a board and pick what it ranks.':'',e?addBtn('boards','Add board'):'');
  return h+'<div class="grid">'+S.boards.map(boardCard).join('')+'</div>';
}
function boardCard(b){
  var e=ed(),rows=boardRows(b),mx=Math.max.apply(null,rows.map(function(r){return Math.abs(r.v);}).concat([1]));
  return '<article class="card board"><div class="card-top"><div><h3>'+esc(b.title)+'</h3><p class="meta">'+(b.source==='stores'?'Stores':'Players')+' · '+esc(fieldLabel(b.source,b.field))+(b.dir==='asc'?' · lowest first':'')+'</p></div>'+(e?'<button class="btn" data-act="edit" data-coll="boards" data-id="'+esc(b.id)+'">Edit</button>':'')+'</div>'+
    (rows.length?'<ol>'+rows.map(function(r,i){return '<li><span class="rk">'+(i+1)+'</span><span class="nm">'+esc(r.name)+'</span><span class="vl">'+esc(fmtField(b,r.v))+'</span><div class="track"><i style="width:'+Math.max(2,Math.abs(r.v)/mx*100)+'%"></i></div></li>';}).join('')+'</ol>':'<p class="faint">Nothing to rank yet.</p>')+'</article>';
}

    if(pid&&!p)return null;
    if(p&&num(p.money)<cost){toast(p.name+' has '+money(p.money)+'. This restock costs '+money(cost)+'.','bad');return null;}
    return async function(){
      var patch={menu:{}};patch.menu[md.itemId]={stock:num(it.stock)+qty,lastRestock:{qty:qty,at:now()}};
      var ok=await write('stores',st.id,patch);
      if(ok&&p&&cost>0)ok=await write('players',p.id,{money:num(p.money)-cost,spentToday:num(p.spentToday)+cost});
      if(ok)toast('Restocked '+qty+' '+it.name+(cost>0?' for '+money(cost):''));
    };
  },
  accept:function(form,md){
    var d=byId(S.deliveries,md.id);if(!d)return null;
    var sid=form.elements.namedItem('store').value,pid=form.elements.namedItem('payer').value;
    return async function(){
      if(await write('deliveries',d.id,{status:'accepted',storeId:sid,acceptedBy:pid,acceptedAt:now()}))toast('Order accepted');
    };
  },
  decline:function(form,md){
    var d=byId(S.deliveries,md.id);if(!d)return null;
    var fake=isFake(d.id),pid=form.elements.namedItem('payer').value,p=pid?byId(S.players,pid):null;
    var payEl=form.elements.namedItem('pay'),pay=payEl?payEl.checked:false;
    var bonus=(fake&&p&&pay)?catchBonus():0;
    return async function(){
      var data={status:'declined',verdict:fake?'fake':'real',completedAt:now(),declinedBy:p?p.id:'',bonus:bonus};
      if(fake)data.tells=tellsOf(d.id);
      var ok=await write('deliveries',d.id,data);
      if(ok&&bonus>0)await write('players',p.id,{money:num(p.money)+bonus,earnedToday:num(p.earnedToday)+bonus});
      if(ok)toast(fake?'Fake order caught':'Order declined');
    };
  },
  deliver:function(form,md){
    var d=byId(S.deliveries,md.id);if(!d)return null;
    var fake=isFake(d.id),pidEl=form.elements.namedItem('payer');
    var pid=pidEl?pidEl.value:d.acceptedBy,p=pid?byId(S.players,pid):null;
    var st=d.storeId?byId(S.stores,d.storeId):null;
    var payEl=form.elements.namedItem('pay'),pay=payEl?payEl.checked:true;
    var amount=Math.round(num(d.reward)*multiplier());
    return async function(){
      var ok;
      if(fake){
        var pen=p?Math.min(Math.max(0,num(p.money)),fakePenalty()):0;
        ok=await write('deliveries',d.id,{status:'scam',verdict:'fake',completedAt:now(),acceptedBy:p?p.id:'',penalty:pen,paid:0,tells:tellsOf(d.id)});
        if(ok&&pen>0)await write('players',p.id,{money:num(p.money)-pen,spentToday:num(p.spentToday)+pen});

        return;
      }
      ok=await write('deliveries',d.id,{status:'delivered',verdict:'real',completedAt:now(),acceptedBy:p?p.id:'',paid:(p&&pay)?amount:0});
      if(ok&&p&&pay)ok=await write('players',p.id,{money:num(p.money)+amount,earnedToday:num(p.earnedToday)+amount});
      if(ok&&st){
        var left={},touched=false;
        (d.items||[]).forEach(function(it){var m=findMenu(st,it.name);if(m){var have=left[m.id]!==undefined?left[m.id]:num(m.stock);left[m.id]=Math.max(0,have-num(it.qty));touched=true;}});
        if(touched){var mp={menu:{}};Object.keys(left).forEach(function(k){mp.menu[k]={stock:left[k]};});await write('stores',st.id,mp);}
      }
      if(ok)toast('Delivery completed');
    };
  }
};

async function submitModal(ev){
  ev.preventDefault();
  var md=S.modal;if(!md)return;
  var form=$('#mform');
  if(md.custom){var run=CUSTOM[md.key](form,md);if(!run)return;closeModal();await run();return;}
  var sc=SCHEMAS[md.key],data={},i;
  for(i=0;i<sc.fields.length;i++){
    var f=sc.fields[i],el=form.elements.namedItem(f.k);
    if(f.t==='stats'){
      var st={};
      form.querySelectorAll('.statrow').forEach(function(r){var k=r.querySelector('.sk').value.trim();if(k)st[k]=num(r.querySelector('.sv').value);});
      data.stats=st;
    }else if(f.t==='inv'){
      var invOut={},old0=getDoc('players',md.id)||{},oi=old0.inv||{};
      form.querySelectorAll('[data-inv]').forEach(function(r){var k=r.dataset.inv,q=Math.max(0,Math.floor(num(r.querySelector('.iv').value)));if(q>0&&oi[k])invOut[k]={name:oi[k].name,qty:q};});
      data.inv=invOut;
    }else if(f.t==='items'){
      var items=[];
      form.querySelectorAll('.itemrow').forEach(function(r){
        var qty=Math.max(1,Math.floor(num(r.querySelector('.iq').value,1))),sel=r.querySelector('.is').value,name='',itemId='',storeId='';
        if(sel.indexOf('store:')===0){var parts=sel.split(':'),s1=byId(S.stores,parts[1]),mi=s1&&(s1.menu||{})[parts[2]];if(mi){name=mi.name;itemId=parts[2];storeId=parts[1];}}
        else if(sel.indexOf('shop:')===0){var si=byId(S.shops,sel.slice(5));if(si){name=si.name;itemId=si.id;}}
        if(!name)name=r.querySelector('.in').value.trim();
        if(name)items.push({qty:qty,name:name,itemId:itemId,storeId:storeId});
      });
      if(!items.length){toast('Add at least one item to deliver.','bad');return;}
      data.items=items;
    }else if(f.t==='datetime'){
      var ms=el.value?new Date(el.value).getTime():NaN;
      if(!isFinite(ms)){el.focus();toast('Pick a date and time for "'+f.label+'".','bad');return;}
      data[f.k]=ms;
    }else if(f.t==='check'){data[f.k]=el.checked;}
    else if(f.t==='number'){
      var raw=el.value.trim();
      if(raw===''){data[f.k]=f.optional?null:0;}
      else{var n=num(raw);if(f.min!=null)n=Math.max(f.min,n);if(f.max!=null)n=Math.min(f.max,n);data[f.k]=n;}
    }else{
      data[f.k]=el.value.trim();
      if(f.req&&!data[f.k]){el.focus();toast('Fill in the '+f.label.toLowerCase()+' first.','bad');return;}
    }
  }
  var id=md.id||db.collection(md.coll).doc().id;
  var old=getDoc(md.coll,id)||{};
  if(md.key==='settings'){if(!data.gameName)data.gameName='Your game';if(!data.currency)data.currency='$';}
  if(md.key==='events'){
    if(data.endsAt<=data.startsAt){toast('The event has to end after it starts.','bad');return;}
    if(data.type!=='discount')data.shopId='';
    if(data.type==='other')data.value=0;
    if(data.type==='rush')data.value=Math.max(1,Math.min(40,Math.round(data.value||8)));
  }
  if(md.key==='shops'&&!data.shopId){toast('Create a shop first.','bad');return;}
  if(md.key==='shopdefs')data.createdAt=old.createdAt||now();
  var fk=false;
  if(md.key==='deliveries'){
    fk=!!data._fake;delete data._fake;
    if(!old.createdAt)data.createdAt=now();
    data.status=old.status||'offered';
  }
  closeModal();
  var ok=await write(md.coll,id,Object.assign({},old,data),{merge:false});
  if(!ok)return;
  if(md.key==='deliveries'){
    var was=isFake(id);
    if(fk&&!was)await write('deliverysecrets',id,{fake:true,tells:['Marked as fake by you']},{merge:false});
    if(!fk&&was)await removeDoc('deliverysecrets',id);
  }
  if(md.key==='events')await syncRush(id,Object.assign({},old,data));
  toast('Saved');
  if(md.key==='shopdefs'&&!S.shopSel)S.shopSel=id;
}

  btn.dataset.label=btn.textContent;btn.textContent=btn.dataset.arm;btn.classList.add('armed');

var cfgOk=!!(firebaseConfig&&firebaseConfig.apiKey&&String(firebaseConfig.apiKey).indexOf('PASTE')!==0);
function flatten(o,p,out){
  Object.keys(o).forEach(function(k){
    var v=o[k],key=p?p+'.'+k:k;
    if(v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).length){flatten(v,key,out);}else{out[key]=v;}
  });
  return out;
}
render();
if(!cfgOk){
  S.noDb=true;S.setup=true;schedule();
}else{
  var app=initializeApp(firebaseConfig);
  var fdb=getFirestore(app);
  var auth=getAuth(app);
  db={
    collection:function(name){
      var ref=collection(fdb,name);
      return {
        onSnapshot:function(next,err){
          return onSnapshot(ref,function(snap){
            next({docs:snap.docs.map(function(d){return {id:d.id,data:function(){return d.data();}};}),metadata:snap.metadata});
          },function(e){if(err)err(e);});
        },
        doc:function(id){var r=id?doc(ref,id):doc(ref);return {id:r.id};}
      };
    },
    doc:function(path){
      var r=doc(fdb,path);
      return {
        set:function(d){return setDoc(r,d);},
        update:function(d){return updateDoc(r,flatten(d,'',{}));},
        delete:function(){return deleteDoc(r);}
      };
    }
  };
  S.signIn=function(){return signInWithPopup(auth,new GoogleAuthProvider()).catch(function(){toast('Sign-in did not finish.','bad');});};
  S.signOut=function(){return signOut(auth);};
  onAuthStateChanged(auth,function(u){
    S.signedIn=!!u;
    if(!u){S.owner=false;S.secrets={};schedule();return;}
    /* The database rules decide who may write; this probe asks them. */
    setDoc(doc(fdb,'meta','owner-check'),{at:Date.now()}).then(function(){
      S.owner=true;listenSecrets();maybeRoll();maybeMigrate();schedule();
    }).catch(function(){
      S.owner=false;toast('This account is not allowed to edit this site.','bad');schedule();
    });
  });
  COLLS.forEach(listen);
  schedule();
}
})();
</script>
</body>
